<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perpustakaan Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- 1. Halaman masuk (user biasa atau admin) -->
<main class="gate" id="gate" hidden>
  <form id="gateForm" autocomplete="off">
    <h1 id="gateTitle"></h1>
    <p class="sub" id="gateSub"></p>
    <label for="username">Username</label>
    <input id="username" type="text" minlength="2" maxlength="30" required
           pattern="[A-Za-z0-9_\-]{2,30}" autocapitalize="none" spellcheck="false" placeholder="mis. budi_01">
    <div id="pwBox" hidden>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
    </div>
    <p class="hint">2-30 karakter: huruf, angka, _ atau -</p>
    <button class="btn" id="gateBtn" type="submit">Masuk</button>
    <p class="err" id="gateErr" role="alert"></p>
  </form>
</main>

<!-- 2. Halaman media (user biasa) -->
<div id="app" hidden>
  <header class="topbar">
    <h1 id="title"></h1>
  </header>

  <main class="wrap">
    <!-- Home -->
    <section class="tab" id="tab-home" aria-label="Home">
      <div class="layout">
        <section aria-label="Pemutar" class="playcol">
          <div class="stage" id="stage">
            <div class="cover" id="cover"></div>
            <video id="player" controls playsinline preload="metadata"></video>
          </div>
          <div class="now">
            <h2 id="nowTitle">Pilih media untuk diputar</h2>
            <p id="nowNote"></p>
          </div>
          <p class="err" id="plErr" role="alert"></p>
        </section>
        <div>
          <h3 class="sec">Daftar media</h3>
          <ul class="list" id="list" aria-label="Daftar media"></ul>
        </div>
      </div>
    </section>

    <!-- Premium -->
    <section class="tab" id="tab-premium" aria-label="Premium" hidden>
      <div class="card hero">
        <div class="badge-ic"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8z"/></svg></div>
        <h2>Premium</h2>
        <p>Fitur Premium segera hadir. Kami akan memberi tahu lewat menu Notifikasi saat sudah tersedia.</p>
      </div>
    </section>

    <!-- Notifikasi -->
    <section class="tab" id="tab-notif" aria-label="Notifikasi" hidden>
      <h2 class="tabttl">Notifikasi</h2>
      <ul class="notifs" id="notifs"></ul>
    </section>

    <!-- Profil -->
    <section class="tab" id="tab-profil" aria-label="Profil" hidden>
      <div class="card profile">
        <div class="avatar" id="avatar" aria-hidden="true"></div>
        <h2 id="who"></h2>
        <p class="hint" id="mediaCount"></p>
        <button class="btn ghost" id="logout" type="button">Ganti username</button>
      </div>
    </section>
  </main>

  <nav class="bottomnav" aria-label="Navigasi utama">
    <button type="button" data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span>Home</span></button>
    <button type="button" data-tab="premium"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8z"/></svg><span>Premium</span></button>
    <button type="button" data-tab="notif"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15L6 16z"/><path d="M10 21h4"/></svg><span>Notifikasi</span><i class="dot" id="notifDot" hidden></i></button>
    <button type="button" data-tab="profil"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span>Profil</span></button>
  </nav>
</div>

<!-- 3. Dashboard admin (tanpa form login; masuk lewat halaman 1) -->
<div id="admin" hidden>
  <div class="wrap">
    <div class="bar">
      <h1>Kelola media</h1>
      <button class="btn ghost" id="aOut" type="button">Keluar</button>
    </div>
    <section class="upload" aria-label="Upload">
      <h2>Upload video atau audio</h2>
      <div class="row">
        <input id="file" type="file" accept="video/*,audio/*">
        <button class="btn" id="uploadBtn" type="button">Upload</button>
      </div>
      <progress id="prog" value="0" max="100" hidden></progress>
      <p class="err" id="upErr" role="alert"></p>
      <p class="hint" id="upOk" style="margin:6px 0 0"></p>
    </section>
    <div class="stats">
      <div><b id="sCount">0</b><span class="hint">file</span></div>
      <div><b id="sSize">0</b><span class="hint">total ukuran</span></div>
    </div>
    <div class="tools">
      <input type="search" id="q" placeholder="Cari nama file atau uploader">
      <label><input type="checkbox" id="all"> Pilih semua</label>
      <button class="btn danger" id="del" type="button" disabled>Hapus terpilih</button>
    </div>
    <p class="err" id="aerr" role="alert"></p>
    <ul class="alist" id="alist"></ul>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
